<script>
        // Credenciales de Supabase
        const SUPABASE_URL = 'https://cwacaqewinvuyunjprwd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_E6pV0fQw-a0jhmW61X_aVg_igoPZ2G3';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let actividadesExtraidas = [];
        let nombreMaquinaDetectada = "HUSKY 3"; // Valor por defecto extraído del archivo

        function procesarArchivoExcel(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('nombreArchivo').innerText = file.name;

            // Intentar detectar el nombre de la máquina desde el nombre del archivo (ej. "HUSKY 3 - ABE.xlsx")
            const nombreLimpio = file.name.split('-')[0].split('.')[0].trim();
            if (nombreLimpio) {
                nombreMaquinaDetectada = nombreLimpio;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                const primeraHoja = workbook.SheetNames[0];
                const hoja = workbook.Sheets[primeraHoja];
                const filas = XLSX.utils.sheet_to_json(hoja);

                actividadesExtraidas = filas.map(f => ({
                    codigo: f['Código'] || f['CODIGO'] || 'L-000',
                    sistema: f['Sistema'] || f['SISTEMA'] || 'General',
                    componente: f['Componente'] || f['COMPONENTE'] || 'Sin nombre',
                    frecuencia: f['Frecuencia'] || f['FRECUENCIA'] || 'Diaria',
                    estandar_ejecucion: f['Estándar'] || f['ESTANDAR'] || '',
                    condicion_anormal: f['Condición Anormal'] || '',
                    material_herramienta: f['Material'] || '',
                    tiempo_estimado_seg: 300,
                    activo: true
                }));

                document.getElementById('totalActividades').innerText = actividadesExtraidas.length;
                document.getElementById('seccionPrevia').classList.remove('hidden');
            };
            reader.readAsArrayBuffer(file);
        }

        async function obtenerOCrearMaquina(nombre) {
            // 1. Buscar si la máquina ya existe en Supabase
            let { data: maquina, error: fetchError } = await supabaseClient
                .from('maquinas')
                .select('id')
                .eq('nombre', nombre)
                .maybeSingle();

            if (maquina) {
                return maquina.id;
            }

            // 2. Si no existe, crear la máquina automáticamente
            const { data: nuevaMaquina, error: insertError } = await supabaseClient
                .from('maquinas')
                .insert([{ nombre: nombre, area: 'Inyección PET', activo: true }])
                .select('id')
                .single();

            if (insertError) {
                throw new Error("Error al crear la máquina en Supabase: " + insertError.message);
            }

            return nuevaMaquina.id;
        }

        async function subirActividadesASupabase() {
            if (actividadesExtraidas.length === 0) return;

            const log = document.getElementById('logEstado');
            log.classList.remove('hidden');
            log.innerText = `Buscando o creando la máquina "${nombreMaquinaDetectada}"...`;
            log.className = "mt-6 p-4 rounded-xl text-xs font-mono bg-[#0f111a] border border-purple-500/50 text-purple-300";

            try {
                // Paso A: Obtener el ID de la máquina
                const idMaquina = await obtenerOCrearMaquina(nombreMaquinaDetectada);

                log.innerText = `Asignando ID de máquina (${idMaquina}) y subiendo ${actividadesExtraidas.length} actividades...`;

                // Paso B: Asignar id_maquina a cada actividad
                const actividadesConMaquina = actividadesExtraidas.map(act => ({
                    ...act,
                    id_maquina: idMaquina
                }));

                // Paso C: Insertar las actividades
                const { error: errorActividades } = await supabaseClient
                    .from('actividades')
                    .insert(actividadesConMaquina);

                if (errorActividades) throw errorActividades;

                log.innerText = `¡Éxito! Se vinculó la máquina "${nombreMaquinaDetectada}" y se importaron las ${actividadesExtraidas.length} actividades.`;
                log.className = "mt-6 p-4 rounded-xl text-xs font-mono bg-emerald-950/40 border border-emerald-500/50 text-emerald-300";

            } catch (err) {
                log.innerText = "Error durante la importación: " + err.message;
                log.className = "mt-6 p-4 rounded-xl text-xs font-mono bg-rose-950/40 border border-rose-500/50 text-rose-300";
            }
        }
    </script>
